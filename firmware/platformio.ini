; Weather logger firmware on the Nucleo-F411RE (STM32F411RE), STM32Cube HAL
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_f411re

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
monitor_speed = 115200
; include/ is split into folders: the project's values, and the headers of the files in src/app/
build_src_flags =
    -I include/config
    -I include/app
    -I include/app/stores
    -I include/app/sensor
    -I include/app/messaging
    -I include/app/operations
; the unit tests run on the PC only, never on the board
test_ignore = *

; Unit tests, built for and run on the PC: pio test -e native
; Only the files listed here are compiled: the ones with no hardware in them (test/README.md)
[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@^2.6.1
lib_ldf_mode = off
test_build_src = yes
build_src_filter =
    -<*>
    +<app/messaging/messages.c>
    +<app/messaging/reading_to_message.c>
    +<app/operations/incoming.c>
    +<app/stores/reading_store.c>
    +<app/stores/reply_store.c>
    +<../lib/bme280/bme280_calibration.c>
    +<../lib/bme280/bme280_compensation.c>
    +<../lib/bme280/bme280_raw.c>
    +<../lib/format/format_number.c>
    +<../lib/link/link_buffer.c>
    +<../lib/link/link_framing.c>
    +<../lib/message/message_build.c>
    +<../lib/message/message_fields.c>
    +<../lib/ring/ring_places.c>
    +<../lib/time/time_interval.c>
build_flags =
    -I include/config
    -I include/app
    -I include/app/stores
    -I include/app/sensor
    -I include/app/messaging
    -I include/app/operations
    -I lib/bme280
    -I lib/format
    -I lib/link
    -I lib/message
    -I lib/ring
    -I lib/time
