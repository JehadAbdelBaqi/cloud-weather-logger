; Weather logger firmware on the Nucleo-F411RE (STM32F411RE), STM32Cube HAL
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_f411re]
platform = ststm32
board = nucleo_f411re
framework = stm32cube
monitor_speed = 115200

; the modules in lib/ include board.h, which lives in the project's include/ folder
build_flags = -I include
